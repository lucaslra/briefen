spring:
  application:
    name: briefen
  profiles:
    # BRIEFEN_LOG_FORMAT=json activates the "json" Spring profile,
    # which switches logback-spring.xml from human-readable to structured JSON output.
    include: ${BRIEFEN_LOG_FORMAT:}
  config:
    # Loads .env file if present (KEY=VALUE format). No-op when missing (CI/Docker use real env vars).
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_BIND_ADDRESS:0.0.0.0}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
  tomcat:
    connection-timeout: 310s

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:gemma3:4b}
  timeout: 300s
  num-predict-shorter: ${OLLAMA_NUM_PREDICT_SHORTER:384}
  num-predict-default: ${OLLAMA_NUM_PREDICT_DEFAULT:1024}
  num-predict-longer: ${OLLAMA_NUM_PREDICT_LONGER:2048}

openai:
  base-url: https://api.openai.com
  timeout: 120s

anthropic:
  base-url: https://api.anthropic.com
  timeout: 120s

article:
  fetch-timeout: 10s

briefen:
  cors:
    allowed-origins: ${BRIEFEN_CORS_ALLOWED_ORIGINS:}
  webhook:
    url: ${BRIEFEN_WEBHOOK_URL:}
  openai:
    api-key: ${BRIEFEN_OPENAI_API_KEY:}
  anthropic:
    api-key: ${BRIEFEN_ANTHROPIC_API_KEY:}
  default-prompt: ${BRIEFEN_DEFAULT_PROMPT:}
  # Per-IP rate limiting for the OIDC handshake and first-run setup endpoints.
  rate-limit:
    enabled: ${BRIEFEN_RATE_LIMIT_ENABLED:true}
    max-requests: ${BRIEFEN_RATE_LIMIT_MAX_REQUESTS:30}
    window: ${BRIEFEN_RATE_LIMIT_WINDOW:60s}
  # Bearer-token session lifetime (OIDC logins and API tokens).
  session:
    ttl: ${BRIEFEN_SESSION_TTL:30d}
    # Personal access token lifetime (headless/extension use).
    api-token-ttl: ${BRIEFEN_API_TOKEN_TTL:3650d}
    # HMAC key for the OIDC handshake cookie. Optional — a random per-instance key is used when unset.
    secret: ${BRIEFEN_SESSION_SECRET:}
  cookies:
    # Set true when serving over HTTPS so the OIDC handshake cookie is marked Secure.
    secure: ${BRIEFEN_SECURE_COOKIES:false}
  # OpenID Connect / SSO. Setting `issuer` enables "Sign in with SSO" alongside password login.
  oidc:
    issuer: ${BRIEFEN_OIDC_ISSUER:}
    client-id: ${BRIEFEN_OIDC_CLIENT_ID:}
    client-secret: ${BRIEFEN_OIDC_CLIENT_SECRET:}
    redirect-uri: ${BRIEFEN_OIDC_REDIRECT_URL:}
    scopes: ${BRIEFEN_OIDC_SCOPES:openid,profile,email}
    provider-name: ${BRIEFEN_OIDC_PROVIDER_NAME:SSO}
    username-claim: ${BRIEFEN_OIDC_USERNAME_CLAIM:preferred_username}
    groups-claim: ${BRIEFEN_OIDC_GROUPS_CLAIM:groups}
    admin-group: ${BRIEFEN_OIDC_ADMIN_GROUP:}
    allow-signup: ${BRIEFEN_OIDC_ALLOW_SIGNUP:true}
    link-by-email: ${BRIEFEN_OIDC_LINK_BY_EMAIL:true}
    link-by-username: ${BRIEFEN_OIDC_LINK_BY_USERNAME:true}
    disable-password-login: ${BRIEFEN_DISABLE_PASSWORD_LOGIN:false}

logging:
  level:
    com.briefen: ${BRIEFEN_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
